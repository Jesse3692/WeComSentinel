<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>咖啡店开业促销海报</title>
<style>
  body { margin:0; display:flex; justify-content:center; padding:24px; background:#efe9e1; font-family:"PingFang SC","Microsoft YaHei",sans-serif; }
  .poster { width:480px; height:680px; background:#3e2b22; color:#f5ede3; border-radius:12px; overflow:hidden; position:relative; display:flex; flex-direction:column; }
  .steam { position:absolute; top:36px; right:48px; opacity:.5; }
  .badge { position:absolute; top:32px; left:32px; background:#c98a4b; color:#3e2b22; font-weight:700; padding:8px 16px; border-radius:999px; font-size:14px; letter-spacing:2px; }
  .top { padding:88px 40px 0; }
  .brand { font-size:15px; letter-spacing:6px; color:#c98a4b; }
  h1 { margin:12px 0 4px; font-size:52px; line-height:1.15; font-weight:800; }
  h1 span { color:#c98a4b; }
  .sub { font-size:16px; color:#d9c8b4; letter-spacing:3px; }
  .cup { margin:28px auto 0; }
  .offers { margin-top:26px; padding:20px 32px; background:#4f382c; border-top:1px solid #6b4b39; border-bottom:1px solid #6b4b39; }
  .offer { display:flex; justify-content:space-between; align-items:baseline; padding:8px 0; }
  .offer .name { font-size:15px; }
  .offer .price { font-size:20px; font-weight:700; color:#e8b877; }
  .offer .price small { font-size:12px; font-weight:400; color:#a8917c; text-decoration:line-through; margin-left:6px; }
  .foot { margin-top:auto; padding:0 40px 32px; display:flex; justify-content:space-between; align-items:flex-end; }
  .date { font-size:14px; color:#d9c8b4; }
  .date b { display:block; font-size:20px; color:#f5ede3; margin-bottom:4px; }
  .cta { background:#c98a4b; color:#3e2b22; font-weight:700; padding:12px 24px; border-radius:8px; font-size:15px; letter-spacing:2px; }
</style>
</head>
<body>
<div class="poster">
  <div class="badge">开业限定</div>
  <svg class="steam" width="60" height="60" viewBox="0 0 60 60">
    <path d="M18 50c0-10 8-10 8-20s-8-10-8-20" fill="none" stroke="#c98a4b" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M38 52c0-10 8-10 8-20s-8-10-8-20" fill="none" stroke="#c98a4b" stroke-width="2.5" stroke-linecap="round" opacity=".6"/>
  </svg>
  <div class="top">
    <div class="brand">— 曦岸咖啡 SHORELINE —</div>
    <h1>新店开业<br><span>第二杯半价</span></h1>
    <div class="sub">现烘豆 · 手冲 · 每日新鲜烘焙</div>
  </div>
  <svg class="cup" width="150" height="110" viewBox="0 0 150 110">
    <rect x="30" y="20" width="90" height="70" rx="10" fill="#f5ede3"/>
    <rect x="30" y="20" width="90" height="24" rx="10" fill="#c98a4b"/>
    <path d="M120 38c18 0 18 34 0 34" fill="none" stroke="#f5ede3" stroke-width="8"/>
    <rect x="20" y="90" width="110" height="8" rx="4" fill="#c98a4b"/>
  </svg>
  <div class="offers">
    <div class="offer"><span class="name">经典拿铁 / 燕麦拿铁</span><span class="price">¥18<small>¥28</small></span></div>
    <div class="offer"><span class="name">手冲单品（每日精选）</span><span class="price">¥22<small>¥35</small></span></div>
    <div class="offer"><span class="name">全场第二杯</span><span class="price">半价</span></div>
  </div>
  <div class="foot">
    <div class="date"><b>10.26 — 11.02</b>XX 路 88 号 · 8:00–22:00</div>
    <div class="cta">到店打卡</div>
  </div>
</div>
</body>
</html>
