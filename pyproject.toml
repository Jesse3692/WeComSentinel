[project]
name = "wecom-customer-monitor"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0,<2.1",
    "aiosqlite>=0.20,<1",
    "alembic>=1.13,<2",
    "httpx>=0.27,<1",
    "pydantic-settings>=2.5,<3",
    "cryptography>=43",
    "defusedxml>=0.7,<1",
    "tzdata",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
