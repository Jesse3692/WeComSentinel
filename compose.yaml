services:
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/monitor.db
      MEDIA_DIR: /app/data/media
    volumes:
      - app_data:/app/data
    restart: unless-stopped
  proxy:
    image: caddy:2
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN to your actual hostname}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped
volumes:
  app_data:
  caddy_data:
  caddy_config:
